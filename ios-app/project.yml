name: CamLinkNative
options:
  bundleIdPrefix: com.salvador
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  CamLinkNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.salvador.camlinknative
        PRODUCT_NAME: CamLinkNative
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "CamLinkNative usa a camera do iPhone para transmitir video vertical em alta qualidade para o seu PC."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "CamLinkNative usa o microfone (incluindo lapela USB-C) para transmitir audio ao vivo para o seu PC."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "CamLinkNative conecta diretamente ao receptor no seu computador pela rede Wi-Fi local."
        INFOPLIST_KEY_NSBonjourServices:
          - _camlink._tcp
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
